# 상승 종목 스크리닝 → 원인 분석 → 밸류체인 파급 예측 파이프라인 설정

screener:
  # 조회할 거래일 수 (신호 계산에 필요한 최소치: 120일 + 여유)
  lookback_days: 130
  # 유니버스 필터
  min_market_cap: 100000000000      # 시가총액 하한 1,000억원
  min_avg_turnover: 1000000000      # 20일 평균 거래대금 하한 10억원
  # 시그널 임계값
  momentum_ret20: 0.15              # 강세 지속형: 20일 수익률 15% 이상
  high_proximity: 0.97              # 강세 지속형: 120일 신고가 대비 97% 이상
  volume_surge_ratio: 2.5           # 상승 전환형: 거래량 20일 평균 대비 배수
  golden_cross_window: 7            # 최근 N거래일 내 골든크로스
  # 최종 후보 수
  top_n: 30

# 수평 그래프: 섹터를 관통하는 그룹과 매크로 팩터 노출
horizontal:
  enabled: true
  beta_window: 120                  # 베타 회귀 구간(거래일)
  gap_window: 5                     # 미반영 갭 판정 구간(최근 N거래일)
  min_abs_corr: 0.2                 # 팩터 노출로 인정할 최소 |상관계수|
  min_group_corr: 0.3               # 그룹 파급 대상으로 인정할 최소 상관계수
  max_peers_per_group: 6            # 그룹당 프롬프트/리포트에 넣을 미반영 상위 종목 수
  # 팩터 대용치는 전부 국내 상장 ETF/ETN. 티커가 아닌 종목명 키워드로 런타임 해석한다.
  # keywords는 **우선순위 순서**다. 앞에 있는 것이 먼저 매칭된다.
  # 이름 길이로만 고르던 때 '유가'에 'KIWOOM 미국원유에너지기업'이 뽑혔다.
  # 그건 원유 선물이 아니라 에너지 '기업 주식'이라, 유가가 아니라 섹터 알파를
  # 재게 된다 — 예외 없이 조용히 틀리는 종류다.
  factors:
    - name: 달러
      keywords: [미국달러선물, 달러선물]
      exclude: [인버스, 레버리지, 2X, 기업, 커버드콜]
    - name: 구리
      keywords: [구리실물, 구리선물, 구리]
      exclude: [인버스, 레버리지, 기업, 커버드콜]
    - name: 유가
      keywords: [WTI원유선물, 원유선물, WTI]
      exclude: [인버스, 레버리지, 기업, 커버드콜, 에너지]
    - name: 금
      keywords: [KRX금현물, 금현물, 골드선물, 골드]
      exclude: [인버스, 레버리지, 기업, 커버드콜, 광산]
    - name: 미국채금리
      keywords: [미국채10년, 국채10년, 미국채30년, 미국30년]
      exclude: [인버스, 레버리지, 커버드콜, 기업]
    - name: 국내금리
      keywords: [국고채10년, 국고채3년]
      exclude: [인버스, 레버리지, 커버드콜]

collect:
  news_per_stock: 8                 # 종목당 수집 뉴스 수
  news_days: 14                     # 뉴스 조회 기간(일)
  dart_days: 14                     # DART 공시 조회 기간(일)

# DART 사업보고서에서 수직축 엣지를 추출한다 (python -m src.dart_extract)
dart:
  # 대량 추출이라 Batch API(표준 요금 50%)를 기본으로 쓴다.
  # 비용을 더 낮추려면 claude-haiku-4-5로 바꿀 수 있으나, 인용 준수와
  # 산업 분류 일관성이 떨어질 수 있으니 폐기율·신규 산업 수를 함께 보라.
  model: claude-opus-5
  max_tokens: 8000
  # '사업의 내용'에서 밸류체인에 쓰이는 하위 절만 고른다(주요 제품·원재료·매출·수주).
  # 위험관리·연구개발·기타참고는 분량이 크지만 밸류체인 정보가 없다.
  # 앞에서부터 자르면 뒤쪽 '매출처'가 날아가는데, 그게 전방 관계의 유일한 근거다.
  slim_sections: true
  # 선별 후에도 남는 상한. 13만 자를 통째로 넣으면 요청 하나가 분당 토큰 한도를
  # 넘어 아무리 재시도해도 통과하지 못한다(실제로 5종목이 전부 그렇게 실패했다).
  max_section_chars: 25000
  # 순차 모드에서 요청 사이에 두는 간격(초).
  request_interval: 5

# 관계 그래프: 수직축(밸류체인)과 수평축(공통 동인)을 하나의 엣지 테이블로 본다
graph:
  # 프롬프트에 넣을 엣지의 최소 신뢰도. 밸류체인 2홉 경로는 0.5×0.5=0.25이므로
  # 이 값을 0.25보다 크게 잡으면 수직축이 통째로 사라진다.
  min_edge_confidence: 0.0
  max_members_per_industry: 8       # 산업당 프롬프트에 넣을 종목 수(시총 상위)
  max_drivers: 6                    # 종목당 프롬프트에 넣을 동인 수

analyze:
  model: claude-opus-5
  max_candidates: 20                # 분석 대상 상한 (비용 제어)
  max_tokens: 8000

report:
  site_title: 한국 밸류체인 정리

# 한국은행 ECOS 산업연관표 (python -m src.ecos 로 탐색해 확정한 코드)
#
# 2026-07-28 라이브 탐색 결과. 통계표 834건 중 산업연관 관련 29건이 걸렸고,
# 그중 파급 계산에 쓸 것은 아래 넷이다. 코드를 소스에 박지 않고 여기 두는 이유는,
# 코드가 바뀌었을 때 예외가 아니라 '빈 결과'가 나오고 그건 '산업 간 연관이 없다'와
# 리포트에서 구분되지 않기 때문이다. 여기 있으면 사람이 보고 고칠 수 있다.
#
# 대분류(약 30부문)는 우리 산업 노드보다 거칠어 쓰지 않는다. 중분류를 쓴다.
# 같은 표가 두 계통(271Y0xx / 271Y1xx)으로 나오는데 기준연도가 다르다 —
# 실제 수록 연도는 조회해 보고 최신 쪽을 쓴다.
ecos:
  tables:
    투입계수_중분류:   [271Y121, 271Y069]   # 직접 투입 비중 = 후방 연관 강도
    생산유발_중분류:   [271Y122, 271Y070]   # 간접 파급까지 합산
    총거래_중분류:     [271Y120, 271Y068]   # 금액 원표(검산용)
  # 계수는 강도로만 쓴다. 부호는 절대 여기서 가져오지 않는다 —
  # 구리 상승은 제련에 수혜, 전선에 피해인데 계수는 그 차이를 구분하지 않는다.
  use_for: weight_only
