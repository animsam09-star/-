name: daily-screen

# 자동 실행을 꺼 뒀다. 실행이 실패하면 GitHub가 저장소 주인에게 메일을 보내고,
# 지금은 원인 분석이 429로 못 도는 상태라 매일 돌 만한 값이 나오지 않는다.
# 값은 안 나오는데 메일만 오는 게 지금 상태였다.
#
# 원인 분석이 다시 돌기 시작하면 아래 두 줄의 주석을 풀면 된다.
# 그때까지는 필요할 때 손으로 실행한다(Actions 탭 → Run workflow).
#
# on:
#   schedule:
#     # 평일 17:10 KST (08:10 UTC) — 장 마감 후 실행
#     - cron: "10 8 * * 1-5"
on:
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYYMMDD (비우면 오늘)"
        required: false
      skip_analyze:
        description: "LLM 분석 생략"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.skip_analyze }}" = "true" ]; then ARGS="$ARGS --skip-analyze"; fi
          python -m src.pipeline $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # graph/edges.jsonl은 수직축 누적 자산이라 커밋한다.
          # data/edges_*.jsonl(수평축)은 매일 재계산되므로 .gitignore에서 제외돼 있다.
          git add cases reports graph data/candidates_*.json data/analysis_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily screen $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
