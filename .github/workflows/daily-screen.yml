name: daily-screen

# 매일 3단계로 돈다.
#
#   1) screen   스크리닝·그래프·근거 수집 → 분석 프롬프트를 뽑아 커밋
#   2) analyze  Claude Code가 그 프롬프트에 답해 분석 JSON을 쓰고 커밋
#   3) report   그 분석으로 리포트를 만들고 Pages에 배포
#
# **왜 나눴나** — 원인 분석은 LLM이 필요한데, Messages API는 구독 토큰으로
# 호출할 수 없다(429). claude-code-action은 같은 토큰으로 Claude Code 자체를
# 돌리므로 MAX 구독만으로 매일 자동 분석이 가능하다. API 키를 따로 사지 않아도
# 되는 유일한 경로다.
#
# **analyze가 실패해도 report는 돈다.** 분석은 있으면 좋은 것이고, 없다고 사이트가
# 옛것으로 남을 이유는 없다. 종목 목록과 밸류체인은 분석과 무관하게 값을 한다.
on:
  schedule:
    # 평일 17:20 KST (08:20 UTC) — 장 마감 후. 분석 단계가 있어 여유를 둔다.
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYYMMDD (비우면 오늘)"
        required: false
      skip_analyze:
        description: "원인 분석 생략 (스크리닝·리포트만)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1) 스크리닝
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      base_date: ${{ steps.run.outputs.base_date }}
      has_input: ${{ steps.run.outputs.has_input }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run pipeline (dump analysis input)
        id: run
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ARGS="--dump-analysis-input"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python -m src.pipeline $ARGS
          # 기준일은 스크리너가 정한다(달력이 아니라 마지막 거래일). 파일 이름에서
          # 되읽어 뒤 단계로 넘긴다 — 각 잡이 따로 날짜를 계산하면 하루가 어긋난다.
          F=$(ls -1 data/analysis_input_*.json 2>/dev/null | sort | tail -1)
          if [ -z "$F" ]; then
            echo "has_input=false" >> "$GITHUB_OUTPUT"
            echo "::warning::분석 프롬프트가 만들어지지 않았습니다(후보 0종목)"
            exit 0
          fi
          D=$(basename "$F" .json | sed 's/analysis_input_//')
          echo "base_date=$D" >> "$GITHUB_OUTPUT"
          echo "has_input=true" >> "$GITHUB_OUTPUT"
          echo "기준일 $D"

      - name: Commit input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cases graph data/candidates_*.json data/screen_universe_*.json || true
          git add -f data/analysis_input_*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 스크리닝 $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "푸시 거부 — 리베이스 후 재시도 ($i/5)"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시하지 못했습니다"; exit 1

  # ------------------------------------------------------------------ 2) 분석
  # 실패해도 다음 단계를 막지 않는다 — continue-on-error.
  analyze:
    needs: screen
    if: ${{ needs.screen.outputs.has_input == 'true' && !inputs.skip_analyze }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Claude Code — 원인·파급 분석
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            기준일은 ${{ needs.screen.outputs.base_date }}이다.
            .github/prompts/analysis.md의 지침을 그대로 따라
            data/analyses_${{ needs.screen.outputs.base_date }}.json을 만들어라.
          # 액션 기본 권한으로는 파일을 못 쓴다. 지난 실행이 38턴을 정상으로 돌고도
          # permission_denials_count=14로 아무것도 남기지 못한 이유가 이것이다.
          # 필요한 것만 연다 — 읽기·쓰기·탐색과 검증 명령 하나. 임의 Bash는 열지 않는다.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python -m src.analyze:*)"

      # 실패했을 때 로그를 뒤지지 않아도 이유가 보이게 한다. 지난번엔 액션이
      # '성공'으로 끝났는데 파일만 없어서, 권한 거부 14건을 실행 로그 깊은 곳에서야
      # 찾았다. 결과 요약과 거부된 도구명을 잡 요약에 남긴다.
      - name: 실행 요약
        if: always()
        run: |
          F="${{ steps.claude.outputs.execution_file }}"
          [ -n "$F" ] && [ -f "$F" ] || { echo "실행 로그 없음"; exit 0; }
          python - "$F" <<'PY'
          import json, sys, collections
          raw = open(sys.argv[1], encoding="utf-8").read()
          try:                       # 배열로 저장되기도, JSONL로 저장되기도 한다
              log = json.loads(raw)
          except json.JSONDecodeError:
              log = [json.loads(l) for l in raw.splitlines() if l.strip()]
          if isinstance(log, dict):
              log = [log]
          log = [m for m in log if isinstance(m, dict)]
          res = next((m for m in reversed(log) if m.get("type") == "result"), {})
          print(f"턴 {res.get('num_turns')} · {(res.get('duration_ms') or 0)//1000}초 "
                f"· 권한거부 {res.get('permission_denials_count')}")
          denied = collections.Counter(
              (d.get("tool_name") or "?") for m in log
              for d in (m.get("permission_denials") or []) if isinstance(d, dict))
          for name, n in denied.most_common():
              print(f"  거부 {name} × {n}")
          PY

      - name: Validate
        run: |
          F=data/analyses_${{ needs.screen.outputs.base_date }}.json
          test -f "$F" || { echo "::error::분석 파일이 만들어지지 않았습니다"; exit 1; }
          # --fix: 어긋난 종목만 빼고 나머지는 살린다. 한 종목 때문에 스무 종목을
          # 잃을 이유가 없다.
          python -m src.analyze "$F" --fix

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/analyses_*.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 원인·파급 분석 ${{ needs.screen.outputs.base_date }}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            sleep $((i * 3))
          done
          echo "::error::푸시 실패"; exit 1

  # ------------------------------------------------------------------ 3) 리포트
  report:
    needs: [screen, analyze]
    # analyze가 실패하거나 건너뛰어도 돈다. 분석 없는 리포트가 옛 리포트보다 낫다.
    if: ${{ always() && needs.screen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      deployable: ${{ steps.artifact.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run pipeline (with analysis if present)
        id: pipeline
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          git pull --rebase origin ${{ github.ref_name }} || true
          D="${{ needs.screen.outputs.base_date }}"
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "$D" ] && [ -f "data/analyses_$D.json" ]; then
            ARGS="$ARGS --analyses data/analyses_$D.json"
            echo "원인 분석 사용: data/analyses_$D.json"
          else
            ARGS="$ARGS --skip-analyze"
            echo "::warning::원인 분석이 없어 종목 목록·밸류체인만 만듭니다"
          fi
          python -m src.pipeline $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cases reports graph data/candidates_*.json data/analysis_*.json \
                  data/screen_universe_*.json || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: daily screen $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "푸시 거부 — 리베이스 후 재시도 ($i/5)"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시하지 못했습니다"; exit 1

      # 커밋이 실패해도 배포는 한다. 리포트는 이미 만들어졌고 그게 사람이 보는
      # 결과물이다. 커밋 실패는 누적 자산이 안 쌓인 문제라 잡을 빨갛게 남겨
      # 알리되, 사이트를 옛것으로 두는 벌까지 줄 이유는 없다.
      - name: Mark deployable
        id: artifact
        if: always() && steps.pipeline.conclusion == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.pipeline.conclusion == 'success'
        with:
          path: reports

  deploy:
    needs: report
    if: always() && needs.report.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
