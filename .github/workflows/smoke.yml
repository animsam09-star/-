name: smoke

# 2층 검증: 실제 KRX 데이터로 라이브 경로가 도는가.
# 커밋도 Pages 배포도 하지 않고, 결과물은 아티팩트로만 남긴다.
# 병합 전에 Actions 탭에서 수동 실행해 확인하는 용도.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYYMMDD (비우면 오늘)"
        required: false
      with_llm:
        description: "LLM 원인 분석까지 실행 (ANTHROPIC_API_KEY 필요, 비용 발생)"
        type: boolean
        default: false
      check_dart:
        description: "DART 문서 API 계약 검증 (DART_API_KEY 필요, LLM 비용 없음)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 어떤 Secret이 없어서 무엇이 안 되는지 한눈에 보여준다.
      # 값은 절대 출력하지 않고 등록 여부만 확인한다.
      - name: Report secret availability
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          checks = [
              ("KRX_OPENAPI_KEY", bool(os.getenv("KRX_OPENAPI_KEY")),
               "가격 수집 (인증키 방식) — 권장"),
              ("KRX_ID + KRX_PW", bool(os.getenv("KRX_ID") and os.getenv("KRX_PW")),
               "가격 수집 (로그인 방식, pykrx) — 인증키가 있으면 불필요"),
              ("DART_API_KEY", bool(os.getenv("DART_API_KEY")),
               "공시 수집 + 수직축 자동 구축"),
              ("NAVER_CLIENT_ID", bool(os.getenv("NAVER_CLIENT_ID")), "뉴스 수집"),
              ("ANTHROPIC_API_KEY", bool(os.getenv("ANTHROPIC_API_KEY")), "원인 분석"),
          ]
          width = max(len(n) for n, _, _ in checks)
          for name, ok, purpose in checks:
              print(f"  {'있음' if ok else '없음'}  {name:<{width}}  {purpose}")
          if not checks[0][1]:
              print("::warning::KRX 자격 증명이 없어 스모크 테스트가 실패합니다. "
                    "Settings → Secrets and variables → Actions에서 등록하세요.")
          PY

      # KRX OpenAPI 응답 필드명은 영문 코드라 문서 없이 단정할 수 없다.
      # 추측한 필드는 KeyError가 아니라 '빈 컬럼'이 되어 조용히 틀리므로,
      # 실제 스키마를 여기서 찍어 FIELD_CANDIDATES를 확정한다.
      - name: Discover KRX OpenAPI schema
        if: ${{ always() }}
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          if not os.getenv("KRX_OPENAPI_KEY"):
              print("::warning::KRX_OPENAPI_KEY 미설정 — 스키마 탐색을 건너뜁니다")
              sys.exit(0)

          from datetime import datetime, timedelta, timezone
          from src import krx_api

          # 최근 영업일을 모르므로 며칠 거슬러 올라가며 데이터가 있는 날을 찾는다
          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst)
          schema, used = {}, None
          for back in range(1, 10):
              day = (today - timedelta(days=back)).strftime("%Y%m%d")
              try:
                  records = krx_api.fetch_raw("sto", "stk_bydd_trd", day)
              except krx_api.KrxApiError as e:
                  print(f"  {day}: {e}")
                  continue
              if records:
                  used = day
                  break
          if not used:
              sys.exit("최근 10일 내에 데이터가 있는 날을 찾지 못했습니다. "
                       "인증키와 API별 이용신청 상태를 확인하세요.")

          print(f"기준일 {used} — 응답 {len(records)}건\n")
          schema = krx_api.describe_schema(used)
          for label, fields in schema.items():
              print(f"[{label}]")
              print(f"  {fields}\n")

          # 지금 가정한 후보가 실제와 맞는지 대조한다
          print("=== FIELD_CANDIDATES 해석 결과 (KOSPI 시세) ===")
          unresolved = []
          for canonical in ("ticker", "name", "close", "volume", "value", "market_cap"):
              try:
                  actual = krx_api.resolve_field(records, canonical)
                  print(f"  OK   {canonical:12} → {actual}")
              except krx_api.KrxApiError:
                  unresolved.append(canonical)
                  print(f"  FAIL {canonical:12} → 후보 중 일치 없음")
          if unresolved:
              print(f"::warning::미해석 필드 {unresolved} — "
                    "위 실제 필드 목록을 보고 src/krx_api.py의 FIELD_CANDIDATES를 고치세요")
          PY

      # 단위 테스트는 픽스처를 우리가 직접 만들기 때문에 외부 API의 실제 컬럼명·
      # 인덱스 타입이 바뀌어도 잡지 못한다. 구조적 사각지대라, 여기서 계약을 명시적으로
      # 검증한다. pykrx나 KRX 응답이 바뀌면 조용히 틀리는 대신 여기서 터져야 한다.
      - name: Verify external API contract
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timedelta, timezone

          # 자격 증명부터 확인한다. 없으면 pykrx가 빈 목록을 돌려주고 그 다음 줄이
          # IndexError로 죽어, 정작 무엇이 문제인지 알려주지 못한다.
          if not (os.getenv("KRX_ID") and os.getenv("KRX_PW")):
              sys.exit(
                  "KRX_ID / KRX_PW Secrets가 등록되지 않았습니다.\n"
                  "  KRX가 대량 조회에 로그인을 요구하므로 이 자격 증명 없이는 "
                  "가격 수집 자체가 되지 않습니다.\n"
                  "  등록: Settings → Secrets and variables → Actions → New repository secret\n"
                  "  계정 발급: https://data.krx.co.kr")

          import pandas as pd
          from pykrx import stock

          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst)
          begin = (today - timedelta(days=30)).strftime("%Y%m%d")
          dates = stock.get_previous_business_days(
              fromdate=begin, todate=today.strftime("%Y%m%d"))
          if not dates:
              # 여기 도달했다는 건 자격 증명이 '있는데' 통하지 않았다는 뜻이다.
              from src.screener import KRX_REJECTED_HINT
              sys.exit(f"거래일 조회 결과가 비었습니다({begin}~).\n{KRX_REJECTED_HINT}")
          day = dates[-1].strftime("%Y%m%d")
          print(f"기준일 {day} (최근 {len(dates)}거래일)")
          fail = []

          def check(label, cond, detail=""):
              (print(f"  OK   {label}") if cond
               else (fail.append(f"{label} — {detail}"), print(f"  FAIL {label}: {detail}")))

          # (1) 스냅샷 계열은 티커 인덱스 + 한글 컬럼명
          for fn, kwargs, cols in (
              (stock.get_market_ohlcv, {"market": "KOSPI"}, ["종가", "거래량", "거래대금"]),
              (stock.get_market_cap, {"market": "KOSPI"}, ["시가총액"]),
          ):
              df = fn(day, **kwargs)
              name = fn.__name__
              check(f"{name} 비어있지 않음", df is not None and not df.empty)
              check(f"{name} 티커 인덱스",
                    not isinstance(df.index, pd.DatetimeIndex)
                    and all(str(i).isdigit() for i in df.index[:5]),
                    f"index={type(df.index).__name__} 샘플={list(df.index[:3])}")
              missing = [c for c in cols if c not in df.columns]
              check(f"{name} 컬럼 {cols}", not missing,
                    f"누락={missing} 실제={list(df.columns)}")

          pc = stock.get_market_price_change(day, day, market="KOSPI")
          check("get_market_price_change 종목명 컬럼", "종목명" in pc.columns,
                f"실제={list(pc.columns)}")

          # (2) 상장 목록 — 종목 마스터의 기준이 된다
          tickers = stock.get_market_ticker_list(day, market="KOSPI")
          check("get_market_ticker_list 반환", isinstance(tickers, list) and len(tickers) > 500,
                f"{type(tickers).__name__} len={len(tickers) if tickers else 0}")
          check("상장 목록이 스냅샷을 포함", len(set(tickers) - set(pc.index)) < len(tickers) * 0.2,
                "일괄 조회 누락이 20%를 넘으면 개별 조회 상한에 걸린다")

          # (3) 시계열 계열은 DatetimeIndex — 스냅샷과 타입이 다르다는 사실 자체가 계약이다
          ts = stock.get_market_ohlcv_by_date(begin, day, tickers[0])
          check("get_market_ohlcv_by_date DatetimeIndex",
                isinstance(ts.index, pd.DatetimeIndex), f"index={type(ts.index).__name__}")

          # (4) ETN 전용 시계열 함수는 존재하지 않는다(있으면 factors.py를 단순화할 수 있다)
          check("get_etn_ohlcv_by_date 부재 유지",
                not hasattr(stock, "get_etn_ohlcv_by_date"),
                "함수가 생겼다 — factors.py의 우회 경로를 정리할 수 있다")

          if fail:
              raise SystemExit("외부 API 계약 위반:\n  - " + "\n  - ".join(fail))
          print("외부 API 계약 전부 만족")
          PY

      # DART 문서 API는 확장자가 .xml이지만 실제로는 ZIP을 준다. 인코딩도 EUC-KR과
      # UTF-8이 섞인다. 단위 테스트는 우리가 만든 합성 ZIP만 보므로 이 가정들이
      # 실제로 맞는지 확인하지 못한다 — 여기서 진짜 공시 한 건으로 검증한다.
      # KRX와 독립적이므로 KRX 검증이 실패해도 실행한다 —
      # 한 번의 실행으로 두 소스의 상태를 모두 알 수 있어야 한다.
      - name: Verify DART contract
        if: ${{ always() && inputs.check_dart }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          if not os.getenv("DART_API_KEY"):
              print("::warning::DART_API_KEY 미설정 — DART 계약 검증을 건너뜁니다")
              sys.exit(0)
          from src import dart

          codes = dart.load_corp_codes()
          print(f"corp_code 매핑 {len(codes)}건")
          assert len(codes) > 2000, "상장사 매핑이 비정상적으로 적습니다"

          ticker = "000720"        # 현대건설 — 사업의 내용이 충실한 대형 건설사
          corp = codes.get(ticker)
          assert corp, f"{ticker}의 corp_code가 없습니다"

          report = dart.find_business_report(corp)
          assert report, "최근 2년 정기보고서를 찾지 못했습니다"
          print(f"보고서: {report['report_nm']} ({report['rcept_dt']})")

          text = dart.fetch_document(report["rcept_no"])
          assert len(text) > 20000, f"문서가 너무 짧습니다({len(text)}자) — ZIP/인코딩 처리 확인"
          assert "&#" not in text, "수치 문자 참조가 디코딩되지 않았습니다"
          # 치환 문자는 코드 포인트로 쓴다. 리터럴로 적으면 편집·전송 과정에서
          # 사라져 `"" not in text`가 되는데, 빈 문자열은 모든 문자열에 포함되므로
          # 그 assertion은 문서와 무관하게 언제나 실패한다(실제로 그렇게 거짓 경보가 났다).
          bad = text.count(chr(0xFFFD))
          assert bad == 0, f"인코딩 오류(치환 문자) {bad}개 — 디코딩 후보 순서를 확인하세요"

          section = dart.extract_business_section(text)
          assert section, "'사업의 내용' 절 경계를 찾지 못했습니다 — 제목 정규식 확인"
          ratio = len(section) / len(text)
          print(f"전체 {len(text):,}자 → 사업의 내용 {len(section):,}자 ({ratio:.0%})")
          assert 0.02 < ratio < 0.9, f"절 비중이 비정상입니다({ratio:.0%}) — 목차나 통짜 문서를 잡았을 수 있습니다"
          assert "재무제표" not in section[-2000:], "재무 파트까지 넘어갔습니다"

          # 절 구성은 산업마다 다르다. 건설사에는 '원재료 및 생산설비'가 없고
          # 제조업에는 '수주상황'이 없다. 특정 항목을 필수로 두면 업종에 따라
          # 멀쩡한 추출이 실패로 잡힌다(실제로 현대건설에서 그렇게 걸렸다).
          # 올바른 구간인지만 확인하도록 여러 표지 중 다수 일치로 판정한다.
          markers = ["사업의 개요", "주요 제품", "매출", "원재료", "생산",
                     "수주", "시장", "영업", "경쟁"]
          found = [m for m in markers if m in section]
          assert len(found) >= 4, (
              f"'사업의 내용'다운 표지가 부족합니다({found}) — 잘못된 구간일 수 있습니다")
          print(f"절 표지 확인: {found}")
          print("DART 계약 전부 만족")
          PY

      - name: Run pipeline (smoke)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ANTHROPIC_API_KEY: ${{ inputs.with_llm && secrets.ANTHROPIC_API_KEY || '' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ARGS="--smoke --skip-notify"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.with_llm }}" != "true" ]; then ARGS="$ARGS --skip-analyze"; fi
          python -m src.pipeline $ARGS

      - name: Verify outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys

          reports = sorted(pathlib.Path("reports").glob("2*.html"))
          assert reports, "리포트가 생성되지 않았습니다"
          html = reports[-1].read_text(encoding="utf-8")
          assert len(html) > 500, "리포트가 비어 있습니다"
          print(f"리포트 생성 확인: {reports[-1].name} ({len(html):,}자)")

          data = pathlib.Path("data")
          cands = sorted(data.glob("candidates_*.json"))
          assert cands, "후보 파일이 없습니다"
          payload = json.loads(cands[-1].read_text(encoding="utf-8"))
          n = len(payload["candidates"])
          print(f"후보 {n}종목 / 유니버스 {payload['universe_size']}종목")
          assert payload["universe_size"] > 100, "유니버스가 비정상적으로 작습니다"

          # 종목 마스터(Layer 0) — 스크리닝 필터와 독립적으로 전 종목을 담아야 한다.
          # 유니버스보다 작으면 소형 후방주가 이름 해석에서 빠진다.
          unis = sorted(data.glob("universe_*.json"))
          assert unis, "종목 마스터가 생성되지 않았습니다"
          uni = json.loads(unis[-1].read_text(encoding="utf-8"))["entries"]
          named = sum(1 for e in uni.values() if e.get("name"))
          print(f"종목 마스터 {len(uni)}종목 (이름 확보 {named}종목)")
          assert len(uni) >= payload["universe_size"], (
              f"종목 마스터({len(uni)})가 스크리닝 유니버스({payload['universe_size']})보다 "
              "작습니다 — 전 종목을 담지 못했습니다")
          assert named / max(1, len(uni)) > 0.9, f"종목명 확보율이 낮습니다: {named}/{len(uni)}"

          # 관계 그래프(Layer 1)
          import collections
          edges = [json.loads(l) for l in
                   pathlib.Path("graph/edges.jsonl").read_text(encoding="utf-8").splitlines() if l.strip()]
          by_rel = collections.Counter(e["rel"] for e in edges)
          print(f"수직축 엣지 {len(edges)}개 — {dict(by_rel)}")
          assert by_rel["소속"] > 0, "밸류체인 회사명이 하나도 티커로 해석되지 않았습니다"
          assert by_rel["후방"] > 0 and by_rel["전방"] > 0, "산업 간 관계가 비었습니다"

          daily_edges = sorted(data.glob("edges_*.jsonl"))
          if daily_edges:
              de = [json.loads(l) for l in
                    daily_edges[-1].read_text(encoding="utf-8").splitlines() if l.strip()]
              signs = collections.Counter(e["sign"] for e in de)
              print(f"수평축 엣지 {len(de)}개 — 부호 분포 {dict(signs)}")
              if signs.get(-1, 0) == 0:
                  print("::warning::음(-)의 노출이 하나도 없습니다. "
                        "부호 판정이 작동하는지 확인하세요(구리↑ = 전선 원가 부담).")
          else:
              print("::warning::수평축 엣지가 없습니다.")

          # 수평 그래프는 실패해도 파이프라인이 죽지 않으므로 명시적으로 확인한다
          groups = sorted(data.glob("groups_*.json"))
          factors = sorted(data.glob("factors_*.json"))
          if groups and factors:
              g = json.loads(groups[-1].read_text(encoding="utf-8"))
              f = json.loads(factors[-1].read_text(encoding="utf-8"))
              print(f"그룹 {len(g['groups'])}개 / 팩터 {len(f['factor_moves'])}개 / "
                    f"갭 산출 그룹 {len(f['group_gaps'])}개")
              proxies = f.get("factor_proxies", {})
              for name, info in proxies.items():
                  print(f"  팩터 대용: {name} → {info['proxy_name']} ({info['ticker']})")
              if not f["factor_moves"]:
                  print("::warning::팩터가 하나도 해석되지 않았습니다. "
                        "config.yaml의 키워드를 점검하세요.")
              if not g["groups"]:
                  print("::warning::그룹이 하나도 구성되지 않았습니다.")
          else:
              print("::warning::수평 그래프 산출물이 없습니다 — 로그에서 실패 원인을 확인하세요.")
          PY

      - name: Upload artifacts
