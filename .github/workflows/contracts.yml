name: contracts

# 「단일판매·공급계약체결」 공시를 모아 회사 간 거래를 만든다.
#
# 사업보고서 경로(dart-extract)와 다른 점: 계약상대방·금액·기간이 정해진 항목으로
# 들어 있어 LLM 없이 파싱만으로 읽힌다. 그래서 152종목 제한 없이 공시를 낸 모든
# 상장사가 대상이 된다. 대신 계약을 안 낸 회사는 안 잡히므로 두 경로가 서로를
# 보탠다.
#
# 자동 실행은 꺼 뒀다 — 필요할 때 손으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간(일). 기본 365"
        required: false
        default: "365"
      limit:
        description: "본문을 받을 최대 건수 (비우면 전부). 첫 실행은 작게"
        required: false

permissions:
  contents: write

concurrency:
  group: contracts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect contract disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ARGS="--days ${{ inputs.days || '365' }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m src.dart_contracts $ARGS

      - name: Summarise
        run: |
          python - <<'PY'
          import json, pathlib, collections
          p = pathlib.Path("data/contracts.json")
          rows = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          named = [r for r in rows if r["parsed"]["counterparty"]]
          print(f"계약 {len(rows)}건 / 계약상대방 확보 {len(named)}건")
          # 어떤 회사가 몇 건을 냈는지 — 편중돼 있으면 커버리지가 넓지 않다는 뜻이다.
          top = collections.Counter(r["corp_name"] for r in rows).most_common(10)
          for name, n in top:
              print(f"  {name} {n}건")
          PY

      - name: Commit contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/contracts.json
          if git diff --staged --quiet; then
            echo "변경 없음"; exit 0
          fi
          git commit -m "[CF-Pages-Skip] chore: 공급계약 공시 수집 $(date +%Y-%m-%d)"
          # 수집이 오래 걸리는 사이 브랜치가 앞서 나갈 수 있다. 거부되면 받아 온
          # 공시가 통째로 버려지므로 리베이스로 얹어 다시 민다.
          for i in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "푸시 거부 — 리베이스 후 재시도 ($i/5)"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시하지 못했습니다"; exit 1
