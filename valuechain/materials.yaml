notes: |
  구리 가격의 부호가 노드마다 갈린다 — 제련은 재고 평가익으로 수혜, 전선·가공은
  원가 상승으로 피해다. 한 방향으로 퍼뜨리면 안 된다.
  고려아연·영풍은 아연·연 중심이라 동제련과 분리했다. 아연 사이클은 따로 돈다.
