drivers: [LME 비철 가격, 광물 수급, 전기차·전력망 수요, 환율]
peers: [고려아연, 풍산, LS, 영풍]
upstream:
  - segment: 광산·비철 원광
    companies: []          # 동정광·철광석은 전량 수입, 상장 종목이 없다
  - segment: 비철 스크랩
    companies: []          # 순수 스크랩 상장사가 사실상 없다
downstream:
  - segment: 동제련
    companies: [LS, 풍산]
  - segment: 아연·연 제련
    companies: [고려아연, 영풍]
  - segment: 전선·구리 가공
    companies: [LS, LS에코에너지, 대한전선, 가온전선, 풍산]
  - segment: 전구체
    companies: [에코프로머티, 포스코퓨처엠]
