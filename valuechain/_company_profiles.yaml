# 종목별 생산 품목과 거래처 — 공시로 못 채운 자리를 메우는 표.
#
# 왜 필요한가. 소속 종목 152개 중 78개만 사업보고서를 받아 뒀고, 나머지 74개는
# 손으로 쓴 밸류체인 YAML에서 왔다. 그쪽은 회사 **이름**만 있고 무엇을 만드는지가
# 없다. 그래서 '전공정 장비' 한 상자에 원익IPS·유진테크·주성엔지니어링·피에스케이가
# 같이 들어가 서로 대체재처럼 보였다. 넷은 만드는 장비가 전부 다르다.
#
# ## 규칙
#
# 1. **출처를 반드시 적는다.** 출처 없는 항목은 검증할 수 없고, 그러면 사실과
#    추정이 섞인다. 이 표는 사업보고서보다 신뢰도가 낮게(0.6) 들어가며, 화면에도
#    출처가 공시가 아님이 드러난다.
# 2. **거래처는 확인된 것만.** '아마 삼성전자에 팔 것이다'는 적지 않는다.
#    기사·IR 자료에 이름이 나온 것만 적는다.
# 3. 공시에서 품목이 나오면 **공시가 이긴다.** 이 표는 빈자리를 메우는 용도다.
#
# ## 형식
#
#   <티커>:
#     name: 종목명                 # 대조용. 티커가 진짜 열쇠다.
#     products: [품목, 품목]        # 무엇을 만드는가
#     customers: [회사명]           # 확인된 매출처. 종목 마스터에서 티커로 해석된다
#     suppliers: [회사명]           # 확인된 매입처
#     source: 출처 URL 또는 문서명

036930:
  name: 주성엔지니어링
  products: [ALD(원자층증착) 장비, 시스템LSI용 ALD, 디스플레이·태양전지 장비]
  customers: [SK하이닉스]
  source: https://www.stockplus.com/m/stocks/KOREA-A036930
  note: 반도체 외에 디스플레이·태양전지 장비를 함께 만든다. 반도체 CAPEX만으로
        설명되지 않는 매출이 섞여 있다는 뜻이라, 순수 반도체 장비주와 다르게 본다.

084370:
  name: 유진테크
  products: [LPCVD(저압화학기상증착) 장비, Single Thermal LPCVD BlueJay, Plasma Treatment Albatross]
  customers: [SK하이닉스]
  source: https://m.ddaily.co.kr/page/view/2023062915585707232
  note: DRAM 증착 비중이 커서 DRAM 투자 사이클에 특히 민감하다.

319660:
  name: 피에스케이
  products: [Dry Strip(PR 스트립) 장비, Dry Cleaning, Bevel Etch]
  customers: []
  source: https://www.etnews.com/20170516000212
  note: 드라이 스트립 세계 1위(가트너 기준 점유율 46%). 증착이 아니라 세정·제거
        공정이라 증착 장비사와 수요 동인이 겹치지 않는다.

240810:
  name: 원익IPS
  products: [PECVD(플라즈마 화학기상증착) 장비, HBM향 구리 어닐링 장비]
  customers: [삼성전자, SK하이닉스]
  source: https://www.sedaily.com/article/20051680
  note: HBM 장비 라인이 따로 있어 HBM 증설과 범용 DRAM 증설에 이중으로 붙는다.

