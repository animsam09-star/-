# 산업명 별칭: DART 추출이 만들어 낸 표기 → 그래프에서 쓸 정식 산업명
#
# 산업명을 자유롭게 두면 '시멘트', '시멘트 제조업', '시멘트·레미콘'이 서로 다른
# 노드가 되어 그래프가 조용히 파편화된다. 정규화(공백·접미 제거)로 접히지 않는
# 표기 차이를 여기서 명시적으로 접는다.
#
# 운영 방법: `python -m src.dart_extract` 실행 후 출력되는 '신규 산업' 목록을 보고,
# 기존 산업과 같은 것을 가리키는 표기를 여기에 추가한다. 정규화로 이미 접히는
# 것(예: '시멘트산업' → '시멘트')은 적을 필요가 없다.

레미콘: 시멘트·레미콘
시멘트: 시멘트·레미콘
