# 산업명 별칭: DART 추출이 만들어 낸 표기 → 그래프에서 쓸 정식 산업명
#
# 산업명을 자유롭게 두면 '시멘트', '시멘트 제조업', '시멘트·레미콘'이 서로 다른
# 노드가 되어 그래프가 조용히 파편화된다. 정규화(공백·접미 제거)로 접히지 않는
# 표기 차이를 여기서 명시적으로 접는다.
#
# 운영 방법: `python -m src.dart_extract` 실행 후 출력되는 '신규 산업' 목록을 보고,
# 기존 산업과 같은 것을 가리키는 표기를 여기에 추가한다. 정규화로 이미 접히는
# 것(예: '시멘트산업' → '시멘트')은 적을 필요가 없다.

레미콘: 시멘트·레미콘
시멘트: 시멘트·레미콘
철근: 철근·형강
형강: 철근·형강
봉강: 철근·형강
건축자재: 건자재·마감재
마감재: 건자재·마감재
플랜트: 건설·EPC
건설: 건설·EPC
건설업: 건설·EPC
종합건설: 건설·EPC
조선업: 조선
선박건조: 조선
반도체소자: 반도체
# '반도체장비'는 일부러 접지 않는다. 그래프의 장비 노드는 '전공정 장비'와
# '후공정·HBM 장비'로 갈라져 있고, 둘은 CAPEX 사이클이 다르다. 공시 문구만으로
# 어느 쪽인지 못 가르면 새 노드로 남는 게 맞다 — 아무 쪽에나 붙이면 조용한 오류다.
배터리: 이차전지
전지: 이차전지
전력기기: 전력기기·전선
전선: 전력기기·전선
변압기: 전력기기·전선
# 방향에 주의 — 오른쪽이 정식 산업명이다. defense.yaml의 노드가 '방위산업'이므로
# '방산'을 그쪽으로 접어야 한다. 반대로 두면 별칭이 오히려 노드를 둘로 쪼갠다.
방산: 방위산업
철강업: 철강
제철: 철강
비철금속: 동제련
전기동: 동제련
동정련: 동제련
모래: 골재
자갈: 골재
골재채취: 골재

# 목록에서 뺀 회사 (다시 넣고 싶어지면 이 줄을 보라)
#   HD현대미포(010620), HD현대인프라코어(042670) — 2026-07-28 기준 전 종목
#   마스터 2,764개에 티커 자체가 없다. 유사 이름 후보도 HD현대(267250),
#   HD현대에너지솔루션, HD현대마린솔루션뿐이다. 표기 문제가 아니라 상장 상태
#   문제이므로 이름을 바꿔 봐야 소용없다 — 실제로 'HD현대미포' → '에이치디현대미포'
#   → 'HD현대미포(010620)' 세 번을 헛짚었다. 남은 조선 4사·건설기계 2사가
#   해당 산업을 이미 덮는다. 재상장·사명 복원이 확인되면 그때 되살린다.

# 접지 않기로 한 것 (자동 후보로 다시 뜨면 이 줄을 보라)
#   건설기계 부품 ≠ 건설기계 — 굴착기 완성품(HD건설기계)과 부품(티시테크·ZF)은
#   수주 사이클도 마진 구조도 다르다. 접두가 겹칠 뿐이다.

# 2026-07-28 50종목 추출이 만든 신규 산업. 접을 곳이 없어 그대로 둔다.
#   항공기 엔진·부품   — 한화에어로 항공부문·㈜한화 항공엔진. 방산과 사이클이 다르다
#                        (민항 정비 수요 vs 국방예산).
#   통신장비·케이블     — 전선·구리 가공과 원재료는 같지만 수요가 통신 CAPEX다.
#   석유화학           — 정유와 분리한다. 정제마진과 스프레드가 따로 움직인다.
#   산업용 엔진·발전기   — 건설기계와 함께 팔리지만 발전·선박 수요가 따로 있다.
